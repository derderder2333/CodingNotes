<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>HTML5新增表单属性</title>
    <style>
        /* 伪元素是规定好了有哪些的不能自己用这个格式随便选元素 */
        /* 可通过 CSS 伪元素 ::placeholder 修改placeholder样式 */
        input::placeholder {
            color: pink;
        }
    </style>
</head>

<body>
    <form action="">
        <!-- required 属性表示表单内容不能为空，必须填写。若为空则提交时会提示错误。 -->
        <!-- autofocus 意为自动获得焦点 -->
        <!-- autocomplete 控制是否记录以前输入并提交过的内容。默认值为 on，即开启记忆功能
        再次聚焦时会显示历史输入值-->
        <input type="search" name="sear" id="" required="required" placeholder="pink老师" autofocus="autofocus"
            autocomplete="on">
        <!-- multiple 属性允许用户选择多个值 -->
        <input type="file" name="" id="" multiple="multiple">
        <input type="submit" value="提交">
    </form>

</body>

</html>
