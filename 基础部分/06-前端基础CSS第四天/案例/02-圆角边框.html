<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>圆角边框</title>
    <style>
        div {
            width: 300px;
            height: 150px;
            background-color: pink;
            border-radius: 50px;
            /* 所谓圆角半径是，让边框的四个角等于以这个半径为圆的四分之一圆，
            当这个半径等于边框短边的一半时，至少会有两个角合成一个半圆 */
        }
    </style>
</head>

<body>
    <div></div>
</body>

</html>
