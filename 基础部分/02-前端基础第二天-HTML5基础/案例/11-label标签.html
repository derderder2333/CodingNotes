<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>label标签</title>
</head>
<body>
    <!-- label标签中的for对应表单元素的id，
     当点击label标签时，会自动聚焦到对应的表单元素 ，提高用户体验-->
   <label for="text"> 用户名:</label> <input type="text" id="text" >
   <input type="radio" id="nan" name="sex" value="男"> <label for="nan">男</label>
   <input type="radio" id="nv"  name="sex" value="女"> <label for="nv">女</label>
</body>
</html>
