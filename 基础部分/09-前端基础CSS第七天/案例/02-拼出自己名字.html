<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>利用精灵图拼出自己名字</title>
    <style>
        span {
            float: left;
            /* display: inline-block; */
            background: url(images/abcd.jpg) no-repeat;
        }

        .p {
            width: 100px;
            height: 112px;
            /* background-color: pink; */
            background-position: -493px -276px;
        }


        .i {
            width: 60px;
            height: 108px;
            /* background-color: pink; */
            background-position: -327px -142px;
        }


        .n {
            width: 108px;
            height: 109px;
            /* background-color: pink; */
            background-position: -215px -141px;
        }


        .k {
            width: 105px;
            height: 114px;
            /* background-color: pink; */
            background-position: -495px -142px;
        }

        .o {
            /* 宽和高是图片可视的大小,
            比如整张图是500乘500你可以控制它只显示50乘50 */
            width: 115px;
            height: 116px;
            /* background-color: pink; */
            /* 默认从左上图片左上角开始显示,但是从左上角开始显示不一定是你想要的
            可以用background position让图片相对于(图片元素的)父盒子的左上角向左向上偏移，
            直到我们想要的图案在视口中显示*/
            background-position: -372px -272px;
        }
    </style>
</head>

<body>
    <span class="o">o</span>
    <span class="p">p</span>
    <span class="i">i</span>
    <span class="n">n</span>
    <span class="k">k</span>
</body>

</html>
