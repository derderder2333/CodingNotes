<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 选图标，点添加到购物车，添加进项目，确认,
    跳转到相应项目页面之后下载下来，
    把相应的一整个字体文件放到本地项目文件夹里，
    然后按照demo_index.html的使用方式使用字体图标 */
    @font-face {
      font-family: 'iconfont';
      src: url('fonts2/iconfont.eot');
      src: url('fonts2/iconfont.eot?#iefix') format('embedded-opentype'),
        url('fonts2/iconfont.woff') format('woff'),
        url('fonts2/iconfont.ttf') format('truetype'),
        url('fonts2/iconfont.svg#iconfont') format('svg');
    }

    .iconfont {
      font-family: "iconfont" !important;
      /* 这里可以调整字体图标的大小*/
      font-size: 60px;
      font-style: normal;
      -webkit-font-smoothing: antialiased;
      -webkit-text-stroke-width: 0.2px;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>

</head>

<body>
  <i class="iconfont">&#xe653;</i>
  <span></span>
</body>

</html>
