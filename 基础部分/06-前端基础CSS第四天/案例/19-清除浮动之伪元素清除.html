<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>伪元素清除浮动</title>
    <style>
        /* 相当于升级版的额外标签法 */
        /* 额外标签法是手动加一个空元素这样会污染html结构 */
        /* 而伪元素清除浮动是用伪类的方式在和额外标签法相同的位置生成一个伪元素，
        这个伪元素跟额外标签法一样只能是块级元素，
        因为只有块级元素里面能用clear:both来实现清除浮动,
        因为只有块级元素可以控制纵向，如果是行内或行内快元素，
        他能在同一行显示，就达不到控制纵向的效果，
        他只能控制水平，所以不能用行内或行内块
         */
        /* 默认是 display: inline（行内元素）要改成block */
        /* 因为即使没有文字，伪元素被生成后也可能受父元素的 line-height等影响，
         height: 0是明确别占用可见高度 */
        /* “空内容”确实没字，但伪元素作为盒子可能存在/可响应交互,
         visibility: hidden的作用是:视觉上不可见,
         不响应鼠标等事件/避免干扰点击、焦点 */
        .clearfix:after {
            content: "";
            display: block;
            clear: both;

            height: 0;
            visibility: hidden;
        }

        .clearfix {
            /* IE6、7 专有 */
            /* 为了兼容老版本 */
            /* 表示不缩放（按原始尺寸） */
            *zoom: 1;
        }

        .box {
            width: 800px;
            border: 1px solid blue;
            margin: 0 auto;
        }

        .damao {
            float: left;
            width: 300px;
            height: 200px;
            background-color: purple;
        }

        .ermao {
            float: left;
            width: 200px;
            height: 200px;
            background-color: pink;
        }

        .footer {
            height: 200px;
            background-color: black;
        }
    </style>
</head>

<body>
    <div class="box clearfix">
        <div class="damao">大毛</div>
        <div class="ermao">二毛</div>
    </div>
    <div class="footer"></div>

</body>

</html>
