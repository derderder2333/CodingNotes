<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>复合选择器之链接伪类选择器</title>
    <style>
        /* 1.未访问的链接 a:link  把没有点击过的(访问过的)链接选出来 */
        a:link {
            color: #333;
            /* link和visited互斥，
            但visited生效时text-decoration: none仍然生效
            并不是因为link还活着，而是因为visited它覆盖的属性有权限控制，
            visited只能改变元素的颜色（文本或者背景以及一些线的颜色）
            不能改变text-decoration,所以才沿用了link的text-decoration*/
            text-decoration: none;
        }

        /* 当点击过一次，再刷新网页时，你看到它依然显示橙色，
        并且清了缓存还是橙色，是因为你访问过一次，浏览器就把这个地址写进历史，
        下次渲染他会拿这个历史去对比有没有访问过，
        所以你不应该去清缓存而是应该清理浏览器的浏览历史，
        清完之后再次刷新它就显示为原来的颜色了 */
        /*2. a:visited 选择点击过的(访问过的)链接 */
        a:visited {
            color: orange;
        }

        /*3. a:hover 选择鼠标经过的那个链接 */
        a:hover {
            color: skyblue;
        }

        /* 4. a:active 选择的是我们鼠标正在按下还没有弹起鼠标的那个链接 */
        /* 点击的一瞬 */
        a:active {
            color: green;
        }
    </style>
</head>

<body>
    <a href="#">小猪佩奇</a>
    <a href="http://www.xxxxxxxx.com">未知的网站</a>
</body>

</html>
