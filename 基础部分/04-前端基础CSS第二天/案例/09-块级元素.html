<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>显示模式之块级元素</title>
    <style>
        div {
            /* width: 200px; */
            height: 200px;
            background-color: pink;
        }
    </style>
</head>

<body>
    <div>比较霸道,自己独占一行</div> 瑟瑟发抖
    <!-- 除了p之外，块级元素是可以相互包裹的。 
     p包裹部分块级元素（div,p,section等）会产生自动闭合，
     在浏览器检查的时候能看到， 
     所以尽量不要用p来包裹元素-->
    <p>
    <div>这里有问题</div>
    </p>
</body>

</html>
