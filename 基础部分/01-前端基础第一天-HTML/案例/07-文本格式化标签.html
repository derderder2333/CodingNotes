<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>文本格式化标签</title>
</head>
<body>
    我是<strong>（Strong重要）加粗</strong>的文字
    我是<b>（Bold粗体）加粗----</b>的文字
    我是<em>（Emphasis强调）倾斜</em>的文字
    我是<i>（Italic斜体）倾斜----</i>的文字
    我是<del>（Deleted删除）删除线----</del>
    我是<s>（Strikethrough删除线）删除线</s>
    我是<ins>（Inserted插入）下划线</ins>
    我是<u>（Underline下划线）----下划线</u>
</body>
</html>
