<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>表格属性</title>
</head>
<body>
    <!-- 这些属性要写到表格标签table 里面去 -->
     <!-- align 整个表格在页面中水平居中显示，还可以left，right -->
      <!-- border 表格边框的粗细 ？-->
        <!-- cellpadding 表格单元格的内边距，上下左右都是这个距离-->
         <!-- cellspacing 单元格外边框之间的距离 -->
            <!-- width 表格的宽度 -->
             <!-- height 表格的高度 -->
    <table align="left" border="10" cellpadding="0" cellspacing="0" width="500" height="500">
        <tr><th>姓名</th>  <th>性别</th> <th> 年龄 </th></tr>
        <tr><td>刘德华</td>  <td>男</td> <td> 56 </td></tr>
        <tr><td>张学友</td>  <td>男</td> <td> 58 </td></tr>
        <tr><td>郭富城</td>  <td>男</td> <td> 51 </td></tr>
        <tr><td>黎明</td>  <td>男</td> <td> 57 </td></tr>
    </table>
</body>
</html>
