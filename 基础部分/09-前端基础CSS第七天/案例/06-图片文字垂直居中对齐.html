<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>利用vertical-align实现图片文字垂直居中对齐</title>
    <style>
        /*vertical-align:baseline|top|middle|bottom,
        文字有这四个线,其他元素也有,但是其他元素的线的定义跟文字的线的定义是不一样的,
        我们对其是让一个元素的设定线对齐另一个元素的设定线 */
        a {
            /* vertical-align: bottom; */
            /* 让图片和文字垂直居中 */
            text-decoration: none;
            font-size: 100px;
            /* vertical-align: middle; */
            /* vertical-align: top; */
        }

        /* img {
            vertical-align: middle;
        } */
        /* textarea {
            vertical-align: middle;
        } */
    </style>
</head>

<body>
    <img src="images/ldh.jpg" alt=""> <a href="#">233</a> pink老师是刘德华

    <br>
    <textarea name="" id="" cols="30" rows="10"></textarea> 请您留言
</body>

</html>
