<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .icon {
      width: 1em;
      height: 1em;
      vertical-align: -0.15em;
      fill: currentColor;
      overflow: hidden;
      font-size: 100px;
      /* 修改颜色的话,
      需要iconfont.js文件中按ctrl+f查找fill属性,
      修改特定的颜色为currentColor,
      然后在样式中用color修改颜色才有作用 */
      color: red;
    }
  </style>
</head>

<body>
  <script src="fonts3/iconfont.js"></script>
  <svg class="icon" aria-hidden="true">
    <use xlink:href="#icon-kaixin"></use>
  </svg>

</body>

</html>
