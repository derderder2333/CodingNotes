<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>表单域(了解)</title>
</head>
<body>
   <form action="demo.php" method="POST" name="name1">
    <!--  action：指定url地址，决定表单元素的值提交到哪个页面进行处理。
    method：指定提交方式，主要有 get 提交和 post 提交两种。
    name：指定表单域的名称，用于区分不同的表单域，以便后台识别数据来源。-->
   </form>
</body>
</html>
